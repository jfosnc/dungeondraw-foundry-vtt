{{#*inline "toolPartial"}}
<button
  type="button"
  class="control ui-control control-tool toggle {{#if isActive}}active{{/if}}"
  title="{{localize title}}{{#if titleSuffix}} {{localize titleSuffix}}{{/if}}"
  aria-label="{{localize title}}{{#if titleSuffix}} {{localize titleSuffix}}{{/if}}"
  aria-pressed="{{#if isActive}}true{{else}}false{{/if}}"
  data-tool="{{name}}"
>
  <i class="{{icon}}"></i>
</button>
{{/inline}}

<div
  id="dd-control-tools"
  class="faded-ui sub-controls app control-tools flexcol"
>
  <div class="dd-control-wrapper">
    <div class="addremove-toggle-row">
      <button
        type="button"
        class="control ui-control addremove-toggle {{toggleAddClass}}"
        data-addremove="add"
        aria-pressed="{{#if toggleAddClass}}true{{else}}false{{/if}}"
      >
        {{localize "DD.Add"}}
      </button>
      <button
        type="button"
        class="control ui-control addremove-toggle {{toggleRemoveClass}}"
        data-addremove="remove"
        aria-pressed="{{#if toggleRemoveClass}}true{{else}}false{{/if}}"
      >
        {{localize "DD.Remove"}}
      </button>
    </div>
    <div class="control-row-separator"></div>
    <div class="control-tool-row">
      {{#each row1}} {{> toolPartial}} {{/each}}
    </div>
    <div class="control-row-separator"></div>
    <div class="control-tool-row">
      {{#each row2}} {{> toolPartial}} {{/each}}
    </div>
    <div class="control-row-separator"></div>
    <div class="control-tool-row">
      {{#each row3}} {{> toolPartial}} {{/each}}
      <select name="themePainterThemeKey" data-dtype="string">
        {{#select themePainterThemeKey}} {{#each customThemeKeys as |themeKey|}}
        {{name}} {{#with (lookup ../customThemes themeKey)~}}
        <option value="custom.{{themeKey}}">{{name}}</option>
        {{/with}} {{/each}} {{#each themeKeys as |themeKey|}} {{name}} {{#with
        (lookup ../themes themeKey)~}}
        <option value="module.{{themeKey}}">{{name}}</option>
        {{/with}} {{/each}} {{/select}}
      </select>
    </div>
  </div>
</div>
